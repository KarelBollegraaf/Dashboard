version: "2.4"

services:
  dashboard:
    build: .
    image: bollegraaf-dashboard:1.1.1
    container_name: dashboard
    restart: always

    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: db_user
      DB_PASSWORD: db_password
      DB_NAME: BalerDB
      API_PORT: 3000

    ports:
      - "3000:3000"

    mem_limit: 350m
    mem_reservation: 250m

    networks:
      - proxy-redirect

networks:
  proxy-redirect:
    external: true
    name: proxy-redirect