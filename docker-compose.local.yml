version: "2.4"

services:
  dashboard:
    build: .
    image: bollegraaf-dashboard:1.0.0
    container_name: dashboard
    restart: always

    environment:
      DB_HOST: 192.168.1.1
      DB_PORT: 59972
      DB_USER: db_user
      DB_PASSWORD: db_password
      DB_NAME: BalerDB
      API_PORT: 3000

    ports:
      - "3000:3000"

    mem_limit: 350m
    mem_reservation: 250m